# hydra tmpfiles janitor — prevents the 2026-09-25 disk-full recurrence.
# Install: sudo cp packaging/systemd/hydra-tmpfiles.conf /etc/tmpfiles.d/hydra-tmpfiles.conf
# Apply now: sudo systemd-tmpfiles --clean
# Runs automatically via systemd-tmpfiles-setup.service at boot and
# systemd-tmpfiles-clean.timer (daily). No tmpreaper needed.
#
# /tmp: age out entries older than 7 days. The 2026-09-25 incident found
# 237.6G across 8015 top-level entries (leaked mongo-mem fixtures, npm/cargo
# temp, worker execution reports under /tmp/hydra-executions) with no rule.
q /tmp 1777 root root 7d

# Cache caps: uv and pip caches reached 20G in /root/.cache; agent session
# logs 15G in /root/.hermes/sessions. Age out entries older than 30 days.
d /root/.cache 0700 root root 30d
d /root/.hermes/sessions 0700 root root 30d