# Hydra Production Configuration
# See hydra-config.yaml.example for full documentation of all fields.

overseer:
  bead_discovery_interval: 10s
  max_workers: 3
  default_retries: 3
  max_retries: 5
  retry_delay: 30s
  worker_timeout: 15m
  handoff_timeout: 10m
  resource_monitoring:
    enabled: true
    max_cpu_percent: 80
    max_memory_percent: 80
    mode: hydra
  chain_detection:
    enabled: true
    interval: 10s
    timeout: 10m

api:
  enabled: true
  port: 8089

agents:
  enabled: true
  default_agent: pi
  pi:
    enabled: true
    provider: minimax
    model: MiniMax-M3
    timeout: 10m
    api_key_name: MINIMAX_API_KEY
    # Provider failover: when the primary provider trips the rate-limit
    # circuit breaker (3x 429 within 10m -> open 15m), workers spawn on
    # this fallback instead. Requires the fallback provider's API key in
    # the daemon environment. Leave unset to disable failover.
    # fallback_provider: kimi-coding-plan
    # fallback_model: kimi-k2.7-code

projects:
  auto_discover: false
  list:
    - name: outreach-workflow
      path: /opt/outreach-workflow
      type: single
    - name: srv-file-handler
      path: /home/buddhi/projects/source-to-pay/srv-file-handler
      type: single

intelligence:
  tldr:
    enabled: true
    base_url: http://127.0.0.1:8787
    timeout: 30s
    max_files: 20
    max_tokens: 100000
    indexing:
      enabled: true
      max_concurrent: 2
      queue_size: 100
      retry_attempts: 3
      retry_delay: 5s
  hindsight:
    enabled: true
    base_url: http://127.0.0.1:8888
    timeout: 10s
    limit: 5
    min_score: 0.7
  patterns:
    enabled: true
    min_confidence: 0.7
    max_patterns_per_bead: 5
    extract_code_snippets: true
    storage_path: /opt/dev-tools/components/hydra/.hydra/patterns
  settled_state:
    enabled: true
    check_interval: 30s
    settlement_delay: 2m
    stability_threshold: 0.95
    max_concurrent_checks: 10
    extract_patterns_on_settle: true
    pattern_extraction_timeout: 5m
    retain_unsettled_beads: 1000
    min_settlement_checks: 3

mcp:
  enabled: true
  url: http://127.0.0.1:8765
  port: 8765
  base_url: http://127.0.0.1:8765
  reconnect_interval: 5s
  max_reconnect_attempts: 10
  heartbeat_interval: 30s
  file_reservation_ttl: 30m

validation:
  enabled: true
  tdd_validation_enabled: true
  prd_validation_enabled: true
  max_rounds: 3
  agent_verification_enabled: false
  close_blocked_on_failed: true
  block_stub_implementations: true
  # Reject a completed bead close when the worker left no uncommitted
  # changes on disk for the bead's target files (the "claimed done but
  # edited nothing" case). Fails open when the path is not a git repo or
  # git errors, so it never blocks a close on an inability to check.
  require_diff_on_close: true

# Closed-loop compliance cycle. When all beads in a project are closed,
# hydra runs the verifier tools (hydra-compliance-analyzer plus
# verify-source-vs-go for migration projects), ADJUDICATES each gap as
# real / false_positive / ambiguous before decomposing (only real gaps
# become beads; false positives are recorded and suppressed on future
# cycles; ambiguous ones are surfaced for a human), then creates gap
# beads via task-breakdown. Halts when the surviving-gap set is unchanged
# from the previous cycle (no progress). Before declaring a PRD shippable
# it runs the optional ship_gate below. Loops until zero gaps or max_cycles.
# Per-project overrides via project_configs[i].compliance_cycle.
compliance_cycle:
  enabled: true
  max_cycles: 5
  poll_interval: 60s
  prd_path: docs/PRDs/srv-file-handler-go-migration-20260618.md
  project_dir: /home/buddhi/projects/source-to-pay/srv-file-handler
  analyzer_path: /opt/dev-tools/components/hydra/tools/hydra-compliance-analyzer/hydra-compliance-analyzer
  gap_to_prd_path: /opt/dev-tools/components/hydra/tools/gap-to-prd/gap-to-prd
  task_breakdown_path: /opt/dev-tools/config/pi/skills/task-breakdown/cli.mjs
  # High-IQ model for gap adjudication. Empty = use the agents.pi model.
  # adjudicator_model: ""
  # Product ship-gate: run build/boot/e2e before declaring the PRD
  # shippable. Disabled by default; failure files a ship-gate fix bead
  # instead of approving. A build failure short-circuits; boot_cmd +
  # health_url are optional (boot the product, poll until 2xx, then e2e).
  # ship_gate:
  #   enabled: true
  #   build_cmd: "go build ./..."
  #   boot_cmd: ""
  #   health_url: ""
  #   e2e_cmd: "go test -tags e2e ./..."
  #   timeout: 10m

# CRITICAL: pi.config_dir must point to a valid Pi config with skills.
# See hydra-config.yaml.example and AGENTS.md for details.
pi:
  config_dir: /opt/dev-tools/config/pi
  # Lightweight Pi config for Hydra workers. This copy excludes the
  # context-mode package so each worker starts ~5-10x faster.
  worker_config_dir: /opt/dev-tools/config/pi-worker

  standard-agent:
    enabled: true
    llm:
      provider: minimax
      model: MiniMax-M3
      thinking_level: medium
      timeout: 10m
      api_key_name: MINIMAX_API_KEY
    skills:
      update_interval: 24h
      auto_update: false

  validation-agent:
    enabled: true
    agent_verification_enabled: false
    timeout: 10m
    max_retries: 3
    llm:
      provider: minimax
      model: MiniMax-M3
      api_key_name: MINIMAX_API_KEY
    skills:
      update_interval: 24h
      auto_update: false
